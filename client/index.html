<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>三国杀 · 在线对战</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand">三国杀<span>·在线</span></div>
    <div id="topinfo"></div>
    <div class="spacer"></div>
    <button id="btnLog" class="ghost hidden" aria-controls="logPanel" aria-expanded="false">战报</button>
    <button id="btnHelp" class="ghost">玩法</button>
    <div id="conn" class="conn">未连接</div>
  </header>

  <!-- 大厅 -->
  <section id="lobby" class="screen">
    <div class="panel">
      <h2>创建对局</h2>
      <div class="row"><label>模式</label><div id="modeList" class="chips"></div></div>
      <div class="row"><label>武将包</label><div id="packList" class="chips"></div></div>
      <div class="row"><label>人数</label><input id="seatCount" type="number" min="2" max="8" value="3" /></div>
      <div class="row"><label>昵称</label><input id="nickname" type="text" maxlength="12" placeholder="输入你的昵称" /></div>
      <div class="row">
        <label>填充</label>
        <label class="check"><input id="aiFill" type="checkbox" checked /> 用电脑补足人数（单人也能玩）</label>
      </div>
      <button id="btnCreate" class="primary">创建房间</button>
      <div class="hint">创建后可复制房间号邀请同学加入；3 人以上即自动开 AI。</div>
    </div>

    <div class="panel">
      <h2>加入房间</h2>
      <div class="row"><label>房间号</label><input id="joinId" type="text" placeholder="例如 R1a2b" /></div>
      <div class="row"><label>昵称</label><input id="joinName" type="text" maxlength="12" placeholder="输入你的昵称" /></div>
      <button id="btnJoin" class="secondary">加入</button>
    </div>

    <div class="panel wide">
      <h2>武将一览</h2>
      <div id="generalList" class="generals"></div>
    </div>
  </section>

  <!-- 房间等待 -->
  <section id="room" class="screen hidden">
    <div class="panel room-panel">
      <h2 id="roomTitle">房间</h2>
      <div id="roomSeats" class="seats"></div>
      <div class="row">
        <button id="btnStart" class="primary">开始对局</button>
        <button id="btnCopy" class="ghost">复制房间号</button>
      </div>
      <div class="hint">房主才能开始；未满人时会自动用电脑补足到模式最少人数。</div>
    </div>
  </section>

  <!-- 对局桌面 -->
  <section id="table" class="screen hidden">
    <div id="opponents" class="opponents"></div>
    <div id="tableCenter">
      <div id="phaseInfo"></div>
      <div id="discardInfo"></div>
    </div>
    <div id="selfArea">
      <div id="selfInfo"></div>
      <div id="handRow" class="hand"></div>
      <div id="actionBar" class="actions"></div>
    </div>
  </section>

  <!-- 日志 -->
  <aside id="logPanel">
    <div class="log-head">
      <span>战报</span>
      <span class="log-tools">
        <button id="btnLogClear" class="ghost" type="button">清空</button>
        <button id="btnLogClose" class="ghost" type="button">收起</button>
      </span>
    </div>
    <div id="logList"></div>
  </aside>

  <!-- 询问面板 -->
  <div id="askPanel" class="hidden"></div>
  <!-- 结算 -->
  <div id="overlay" class="hidden"></div>
</div>
<script src="./app.js" type="module"></script>
</body>
</html>
